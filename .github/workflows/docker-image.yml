name: CloudOps Dashboard CI/CD


on:
  push:
    branches:
      - main



env:

  NAMESPACE: cloudops

  BACKEND_IMAGE: abdullahahmed1101076/cloudops-backend

  FRONTEND_IMAGE: abdullahahmed1101076/cloudops-frontend



jobs:


# ==========================
# CI
# ==========================

  ci:


    name: Build and Test

    runs-on: ubuntu-latest



    steps:


    - name: Checkout Repository

      uses: actions/checkout@v4



    # Security Scan

    - name: Gitleaks Scan

      uses: gitleaks/gitleaks-action@v2





# ==========================
# Docker Build & Push
# ==========================


  docker:


    name: Docker Build Push


    needs: ci


    runs-on: ubuntu-latest



    steps:



    - name: Checkout Repository

      uses: actions/checkout@v4



    - name: Docker Login

      uses: docker/login-action@v3

      with:

        username: ${{ secrets.DOCKER_USERNAME }}

        password: ${{ secrets.DOCKER_PASSWORD }}



    # Backend Image


    - name: Build Backend Image

      run: |


        docker build \
        -t $BACKEND_IMAGE:${{ github.sha }} \
        ./backend




    - name: Push Backend Image

      run: |


        docker push \
        $BACKEND_IMAGE:${{ github.sha }}




    # Frontend Image


    - name: Build Frontend Image

      run: |


        docker build \
        -t $FRONTEND_IMAGE:${{ github.sha }} \
        ./frontend




    - name: Push Frontend Image

      run: |


        docker push \
        $FRONTEND_IMAGE:${{ github.sha }}






    # Trivy Scan


    - name: Trivy Backend Scan

      uses: aquasecurity/trivy-action@master

      with:

        image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

        severity: HIGH,CRITICAL




    - name: Trivy Frontend Scan

      uses: aquasecurity/trivy-action@master

      with:

        image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

        severity: HIGH,CRITICAL





# ==========================
# Kubernetes Deployment
# ==========================


  deploy:


    name: Deploy To Civo Kubernetes


    needs: docker


    runs-on: ubuntu-latest



    steps:



    - name: Checkout Repository

      uses: actions/checkout@v4




    - name: Configure Kubernetes

      uses: azure/k8s-set-context@v4

      with:

        kubeconfig: ${{ secrets.KUBE_CONFIG }}






    - name: Update Backend Deployment

      run: |


        kubectl set image deployment/backend \
        backend=$BACKEND_IMAGE:${{ github.sha }} \
        -n $NAMESPACE






    - name: Update Frontend Deployment

      run: |


        kubectl set image deployment/frontend \
        frontend=$FRONTEND_IMAGE:${{ github.sha }} \
        -n $NAMESPACE






    - name: Verify Backend Rollout

      run: |


        kubectl rollout status deployment/backend \
        -n $NAMESPACE






    - name: Verify Frontend Rollout

      run: |


        kubectl rollout status deployment/frontend \
        -n $NAMESPACE
