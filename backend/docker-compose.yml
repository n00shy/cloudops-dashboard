services:

  postgres:
    image: postgres:17
    container_name: cloudops-postgres
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - cloudops-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: cloudops-backend

    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "${APP_PORT}:${APP_PORT}"

    networks:
      - cloudops-network

networks:
  cloudops-network:

volumes:
  postgres_data: